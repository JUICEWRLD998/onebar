[project]
name = "onebar"
version = "0.1.0"
description = "One bar of signal, one checked 160-character reply."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
model = ["openai>=1"]
temporal = ["temporalio>=1.34"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
data = ["openai>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["onebar"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onebar*"]
