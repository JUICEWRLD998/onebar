services:
  - type: web
    name: onebar
    runtime: docker
    plan: free               # no card needed. No disk: state resets on every restart/redeploy.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TINKER_API_KEY
        sync: false          # paste in the dashboard
      - key: ONEBAR_MODEL
        sync: false          # tinker://.../sampler_weights/... (the tuned model)
      - key: IMAP_USER
        sync: false
      - key: IMAP_APP_PASSWORD
        sync: false
      - key: ONEBAR_PUBLIC_URL
        sync: false          # your final https://....onrender.com URL, used for trace links in email
      - key: ONEBAR_BUDGET_USD
        value: "4.6"         # the seeded ledger already holds $3.68; at 3.2 every reply fell back to the template
      - key: TEMPORAL_ADDRESS
        value: 127.0.0.1:7233
